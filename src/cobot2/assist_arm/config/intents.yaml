# 로컬 의도 분류기 (claude_planner_node backend: local) — 비용 0, 오프라인, scikit-learn 글자 n-gram.
# 예시 문장을 계속 추가하면 똑똑해짐. skill 은 planner 허용 목록 중 하나. say = 실행/확인할 때 할 말.
# bring_dish 는 target(음식 키)을, music 은 target(분위기)을 함께 둔다.
intents:
  clear_all:
    say: 다 드셨으면 정리해 드릴게요
    examples: [배불러, 배부르다, 배가 불러, 그만 먹을래, 다 먹었다, 잘 먹었습니다, 식사 끝, 이제 그만, 상 치워, 밥 다 먹었어, 더는 못 먹겠어]
  clear_empty:
    say: 빈 그릇 치워 드릴게요
    examples: [빈 그릇 좀, 다 먹은 그릇, 그릇이 비었어, 이거 다 먹었어, 자리가 좁아, 테이블이 복잡해, 좀 치워줄래]
  pour_water:
    say: 물 한 잔 드릴까요?
    examples: [목이 칼칼해, 목말라, 목이 마르다, 목마르네, 갈증 나, 목이 타, 목이 건조해, 마실 거, 물 마시고 싶어, 사레 걸렸어, 목이 막혀, 음료]
  wipe_table:
    say: 테이블 닦아 드릴게요
    examples: [지저분해, 끈적거려, 쏟았어, 국물 흘렸어, 더러워, 얼룩졌어, 테이블이 젖었어, 엎질렀어]
  music:
    say: 노래 틀어 드릴게요
    target: any
    examples: [심심해, 조용하다, 분위기 좀, 흥 나게, 기분 전환, 신나게 해줘, 지루해, 뭐 들을 거 없나]
  bring_dish:
    say: 김치 가져다 드릴게요
    target: kimchi
    examples: [김치 어딨어, 김치 좀 먹고 싶다, 매운 거 먹고 싶어, 김치가 멀어]
  none:
    say: ''
    examples: [안녕, 고마워, 오늘 날씨 좋다, 너 이름이 뭐야, 몇 시야, 하하, 재밌다, 숙제 해야 돼]
