# 테이블 세팅·물건 정의. !!! 좌표는 전부 자리표시 — 실제 테이블에서 측정해 교체.
table_z_mm: 0.0                      # 테이블 윗면 높이 (베이스 z). finger_pointer 캘리브레이션 table_z_mm 와 같게
place_orientation: [0.0, 180.0, 0.0] # 기본: 그리퍼 수직 아래
user_front: [650.0, 0.0]             # 사용자 앞 (자리 저장 전 기본값)

classes:                             # YOLO 클래스 묶음 (assist_yolo 별칭으로 COCO 대체 가능)
  dishes: [bowl, plate, rice_bowl, soup_bowl, side_dish, side_dish_bowl]   # 커스텀 YOLO: rice_bowl, side_dish (config/yolo_classes.yaml)
  cups: [cup]
  utensils: [spoon, chopsticks, fork]
  # 그 밖의 커스텀 클래스: water_bottle (물병), tissue (휴지), cloth (행주·걸레)

items:                               # 아이템별 파지 (테이블 기준 높이 mm, RG2 open_width 는 1/10mm 단위)
  default:  {grasp_z: 40.0, place_z: 40.0, pre_lift: 120.0}
  bowl:     {grasp_z: 45.0, place_z: 47.0, open_width: 1000}
  rice_bowl: {grasp_z: 45.0, place_z: 47.0, open_width: 1000}
  soup_bowl: {grasp_z: 45.0, place_z: 47.0, open_width: 1000}
  side_dish_bowl: {grasp_z: 30.0, place_z: 32.0, open_width: 1000}
  side_dish: {grasp_z: 30.0, place_z: 32.0, open_width: 1000}
  plate:    {grasp_z: 15.0, place_z: 17.0, open_width: 600}      # 접시는 거치대에 세워 두고 가장자리 파지 권장
  cup:      {grasp_z: 50.0, place_z: 52.0, open_width: 900}
  spoon:    {grasp_z: 8.0,  place_z: 10.0, open_width: 300}
  chopsticks: {grasp_z: 8.0, place_z: 10.0, open_width: 300}
  fork:     {grasp_z: 8.0,  place_z: 10.0, open_width: 300}
  bottle:   {grasp_z: 120.0, place_z: 122.0, open_width: 900, pre_lift: 150.0}
  rag:      {grasp_z: 10.0, place_z: 12.0, wipe_z: 25.0}

racks:                               # 수저·접시·그릇 거치대 (자리 세팅에서 꺼냄). step = 다음 개 위치 차이
  spoon:      {pos: [300.0, -400.0, 0.0], count: 4, step: [0.0, 25.0, 0.0]}
  chopsticks: {pos: [340.0, -400.0, 0.0], count: 4, step: [0.0, 25.0, 0.0]}
  plate:      {pos: [300.0, 400.0, 0.0], count: 4, step: [0.0, 0.0, 0.0]}
  rice_bowl:  {pos: [380.0, 400.0, 0.0], count: 4, step: [0.0, 0.0, 0.0]}

seat_layout:                         # 콕 짚은 자리 기준 오프셋 [u, v] mm (u: 자리→로봇 쪽, v: 왼쪽)
  - {item: spoon,      offset: [20.0, -150.0], from: rack}
  - {item: chopsticks, offset: [20.0, -180.0], from: rack}
  - {item: rice_bowl,  offset: [80.0, -60.0],  from: rack}
  - {item: plate,      offset: [80.0, 70.0],   from: rack}
  - {item: side_dish,  offset: [200.0, 0.0],   from: food, food: kimchi}

foods:                               # 음식 그릇 ("<음식> 줘", 자리 세팅). source: fixed(pos) | detect(detect_class)
  kimchi:   {keywords: [김치], class: side_dish, source: fixed, pos: [450.0, 350.0, 0.0]}
  rice:     {keywords: [밥, 공기밥], class: rice_bowl, source: fixed, pos: [450.0, 300.0, 0.0]}
  soup:     {keywords: [국, 찌개], class: soup_bowl, source: fixed, pos: [500.0, 350.0, 0.0]}
  fruit:    {keywords: [과일, 사과], class: bowl, source: detect, detect_class: bowl}
  side_dish: {keywords: [반찬], class: side_dish, source: fixed, pos: [500.0, 300.0, 0.0]}

clear_station:                       # 정리 위치 (설거지 트레이). 차례로 사용
  slots: [[300.0, -300.0], [300.0, -230.0], [360.0, -300.0], [360.0, -230.0]]

# ---------------------------------------------------------------- v2.2 세팅·정리 (table_planner, docs/ARCHITECTURE_v2.2.md)
# !!! 좌표는 전부 자리표시 — 실제 테이블에서 교시해 교체. 내용(무엇이 몇 개)은 DB storage_inventory 가 기준.
storage:
  stacks:                            # 그릇을 포개 두는 보관 더미. 칸마다 종류 고정 (1.2 위치 기반 구분)
    stack_A: {type: soup_bowl, pos: [300.0, -300.0], max: 4}
    stack_B: {type: rice_bowl, pos: [300.0, -230.0], max: 4}
    stack_C: {type: plate,     pos: [360.0, -300.0], max: 4}
  holders:                           # 수저통 칸 (세워서 꽂음)
    holder_spoon: {type: spoon, pos: [360.0, -230.0], max: 4}
    holder_fork:  {type: fork,  pos: [360.0, -200.0], max: 4}
  temp_slots:                        # 종류가 애매하거나 더미가 가득 찼을 때 잠깐 두는 자리
    temp_1: {pos: [420.0, -300.0]}
    temp_2: {pos: [420.0, -230.0]}
  stack_height_mm:                   # 포갤 때 한 개당 높아지는 양 — 그릇 실측 후 교체
    rice_bowl: 15.0
    soup_bowl: 15.0
    plate: 8.0
type_match_radius_mm: 60.0           # 정리 때 'bowl' 을 자리 템플릿 위치로 밥/국 구분하는 허용 반경
clear_classes: [rice_bowl, soup_bowl, bowl, plate, spoon, fork]   # 정리 대상 (table_planner)
